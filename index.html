<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reads</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        .main-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 0;
        }

        .central-content {
            background-color: grey;
            height: 50vh;
            width: 75vw;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }


        .central-content.animating {
            animation: shrinkExpand 0.8s ease;
        }

        @keyframes shrinkExpand {
            0% {
                width: 75vw;
            }

            50% {
                width: 30vw;
            }

            100% {
                width: 75vw;
            }
        }
    </style>
</head>


<body>

    <main class="main-container">
        <article>
            <h1>Main book</h1>
            <figure class="central-content">
                <img src="/shared-assets/images/examples/elephant.jpg" alt="Elephant at sunset" />
                <figcaption>An elephant at sunset</figcaption>
            </figure>
            <nav>
                <button hx-on:click="
                        const el = document.querySelector('.central-content');
                        el.classList.remove('animating');
                        void el.offsetWidth; /* força reflow (hack importante) */
                        el.classList.add('animating');
                    ">Página Anterior</button>
                <button hx-on:click="alert('You clicked me!')">Próxima Página</button>
            </nav>
        </article>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script>
        const checkImgsFolderLen = async () => {
            const res = await fetch("./imgs/images.json");
            const imagesArr = await res.json();
            console.log(imagesArr.length);
        }
    </script>
</body>

</html>

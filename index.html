<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reads</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        .main-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 0;
        }

        .central-content {
            background-color: grey;
            height: 50vh;
            width: 75vw;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .central-content img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }


        .central-content.animating {
            animation: shrinkExpand 0.8s ease;
        }

        @keyframes shrinkExpand {
            0% {
                width: 75vw;
            }

            50% {
                width: 30vw;
            }

            100% {
                width: 75vw;
            }
        }
    </style>
</head>


<body>

    <main class="main-container">
        <article>
            <h1>Main book</h1>
            <figure class="central-content">
                <img />
            </figure>
            <nav>
                <button hx-on:click="
                        const el = document.querySelector('.central-content');
                        el.classList.remove('animating');
                        void el.offsetWidth;
                        el.classList.add('animating');
                        changeCurrentImageIndex(parseInt(-1));
                    ">Página Anterior</button>
                <button hx-on:click="const el = document.querySelector('.central-content');
                        el.classList.remove('animating');
                        void el.offsetWidth;
                        el.classList.add('animating');
                        changeCurrentImageIndex(parseInt(1));">Próxima Página</button>
            </nav>
        </article>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script>
        const checkImgsFolderLen = async () => {
            const res = await fetch("./imgs/images.json");
            const imagesArr = await res.json();
            return imagesArr.length;
        }

        const changeCurrentImageIndex = async (addIterator) => {
            const imgLen = await checkImgsFolderLen();
            var currentImgIndex = parseInt(localStorage.getItem("imgIndex"));
            var possibleNextImgIndex = addIterator + currentImgIndex;
            if (possibleNextImgIndex >= imgLen || possibleNextImgIndex == -1) { //ultrapassing images quantity
                localStorage["imgIndex"] = 0;
                currentImgIndex = 0;
            }
            else {
                localStorage.setItem("imgIndex", possibleNextImgIndex);
                currentImgIndex = possibleNextImgIndex;
            }

            setImgPath(currentImgIndex);
        }

        const setImgPath = (imgIndex) => {
            var imgEl = document.querySelector("img");
            console.log(imgEl)
            imgEl.src = `./imgs/${imgIndex}.png`;
        }

        htmx.onLoad(function (content) {
            var imgIndex = parseInt(localStorage.getItem("imgIndex"));
            console.log(imgIndex);
            if (isNaN(imgIndex)){
                console.log("is nan")
                localStorage.setItem("imgIndex", 0);
                imgIndex = 0;
            }
                
            setImgPath(imgIndex);
        });
    </script>
</body>

</html>
